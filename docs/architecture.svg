<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" role="img" aria-labelledby="title desc">
  <title id="title">AI Company Qualifier architecture</title>
  <desc id="desc">Google Sheet rows flow through a per-company loop: Jina Reader, markdown cleanup, LLM with structured output, validation and write-back. Any failure marks the row as error and the loop continues. A summary is built when the loop ends.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#22d3ee"/>
    </marker>
    <marker id="arrow-err" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f87171"/>
    </marker>
    <style>
      text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .title { fill: #e6edf3; font-size: 20px; font-weight: 700; }
      .subtitle { fill: #8b949e; font-size: 12px; }
      .label { fill: #e6edf3; font-size: 13px; font-weight: 600; }
      .sub { fill: #8b949e; font-size: 11px; }
      .tag { fill: #22d3ee; font-size: 11px; font-weight: 600; letter-spacing: 1px; }
      .err { fill: #f87171; font-size: 12px; }
      .box { fill: #161b22; stroke: #30363d; stroke-width: 1.5; }
      .box-accent { fill: #0b2a33; stroke: #22d3ee; stroke-width: 1.5; }
      .flow { stroke: #22d3ee; stroke-width: 1.6; fill: none; }
      .flow-err { stroke: #f87171; stroke-width: 1.4; fill: none; stroke-dasharray: 5 4; }
    </style>
  </defs>

  <rect width="1000" height="500" fill="#0d1117"/>

  <text x="40" y="40" class="title">ai-company-qualifier</text>
  <text x="40" y="60" class="subtitle">n8n · Jina Reader · LLM structured output · Google Sheets</text>

  <!-- Row 1: load -->
  <rect x="40" y="84" width="170" height="56" rx="8" class="box"/>
  <text x="125" y="108" text-anchor="middle" class="label">Manual / Schedule</text>
  <text x="125" y="126" text-anchor="middle" class="sub">trigger · Config</text>

  <rect x="250" y="84" width="190" height="56" rx="8" class="box"/>
  <text x="345" y="108" text-anchor="middle" class="label">Google Sheet</text>
  <text x="345" y="126" text-anchor="middle" class="sub">tab: companies</text>

  <rect x="480" y="84" width="200" height="56" rx="8" class="box"/>
  <text x="580" y="108" text-anchor="middle" class="label">Select pending</text>
  <text x="580" y="126" text-anchor="middle" class="sub">normalize URL · cap N</text>

  <rect x="740" y="84" width="220" height="56" rx="8" class="box"/>
  <text x="850" y="108" text-anchor="middle" class="label">Run summary</text>
  <text x="850" y="126" text-anchor="middle" class="sub">counts → Slack (optional)</text>

  <path d="M210,112 L246,112" class="flow" marker-end="url(#arrow)"/>
  <path d="M440,112 L476,112" class="flow" marker-end="url(#arrow)"/>
  <path d="M580,140 L580,186" class="flow" marker-end="url(#arrow)"/>
  <path d="M850,190 L850,144" class="flow" marker-end="url(#arrow)"/>
  <text x="858" y="172" class="sub">done</text>

  <!-- Loop frame -->
  <rect x="40" y="190" width="920" height="200" rx="12" fill="none" stroke="#22d3ee" stroke-width="1.2" stroke-dasharray="2 4"/>
  <rect x="54" y="181" width="320" height="18" fill="#0d1117"/>
  <text x="62" y="194" class="tag">LOOP · 1 company / iteration · wait N s</text>

  <!-- Loop steps -->
  <rect x="60" y="222" width="160" height="64" rx="8" class="box-accent"/>
  <text x="140" y="249" text-anchor="middle" class="label">Jina Reader</text>
  <text x="140" y="268" text-anchor="middle" class="sub">r.jina.ai/&lt;url&gt;</text>

  <rect x="240" y="222" width="160" height="64" rx="8" class="box"/>
  <text x="320" y="249" text-anchor="middle" class="label">Clean + trim</text>
  <text x="320" y="268" text-anchor="middle" class="sub">char budget · blocks</text>

  <rect x="420" y="222" width="160" height="64" rx="8" class="box-accent"/>
  <text x="500" y="249" text-anchor="middle" class="label">LLM qualify</text>
  <text x="500" y="268" text-anchor="middle" class="sub">ICP + JSON schema</text>

  <rect x="600" y="222" width="160" height="64" rx="8" class="box"/>
  <text x="680" y="249" text-anchor="middle" class="label">Validate</text>
  <text x="680" y="268" text-anchor="middle" class="sub">clamp score 1-10</text>

  <rect x="780" y="222" width="160" height="64" rx="8" class="box"/>
  <text x="860" y="249" text-anchor="middle" class="label">Write back</text>
  <text x="860" y="268" text-anchor="middle" class="sub">results + done</text>

  <path d="M220,254 L236,254" class="flow" marker-end="url(#arrow)"/>
  <path d="M400,254 L416,254" class="flow" marker-end="url(#arrow)"/>
  <path d="M580,254 L596,254" class="flow" marker-end="url(#arrow)"/>
  <path d="M760,254 L776,254" class="flow" marker-end="url(#arrow)"/>

  <!-- Error lane -->
  <path d="M140,286 L140,326" class="flow-err" marker-end="url(#arrow-err)"/>
  <path d="M320,286 L320,326" class="flow-err" marker-end="url(#arrow-err)"/>
  <path d="M500,286 L500,326" class="flow-err" marker-end="url(#arrow-err)"/>
  <path d="M680,286 L680,326" class="flow-err" marker-end="url(#arrow-err)"/>
  <path d="M860,286 L860,326" class="flow-err" marker-end="url(#arrow-err)"/>
  <rect x="60" y="330" width="880" height="40" rx="8" fill="#2a1416" stroke="#f87171" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="500" y="355" text-anchor="middle" class="err">any failure → status=error + message on the row → next company</text>

  <!-- Legend -->
  <path d="M40,430 L80,430" class="flow" marker-end="url(#arrow)"/>
  <text x="90" y="434" class="sub">data flow</text>
  <path d="M190,430 L230,430" class="flow-err" marker-end="url(#arrow-err)"/>
  <text x="240" y="434" class="sub">error path (retries first: fetch 3x, LLM 2x)</text>
  <rect x="580" y="421" width="18" height="18" rx="4" class="box-accent"/>
  <text x="606" y="434" class="sub">external call</text>
  <text x="40" y="470" class="subtitle">One bad website never stops the run. Status lives in the sheet, so re-running is safe.</text>
</svg>
